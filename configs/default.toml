# ---------------------------------------------------------------------------
# default <- the ONE config file: who Geist is, how it is built, and the
# values the library starts with. Applied to every build.
# ---------------------------------------------------------------------------
#
#   nim c app.nim                    this file
#   nim c -d:preset=server app.nim   this file, then configs/server.toml over it
#   nimble buildCli -d:preset=iot    the same (shared tasks pass it on)
#   nim c -d:preset=iot -d:x=1 ...   the command line wins over both files
#
# Who reads what:
#
#   section              read by                                becomes
#   -------------------  -------------------------------------  ---------------
#   [project]            geist_database.nimble, nix/default.nix name, version
#   [nim]                config.nims (Nimble-Tasks/preset.nims) --key:value
#   [define]             config.nims                            -d:key=value
#   [passC] / [passL]    config.nims                            --passC/--passL
#   [runtime.storage]    src/geist/settings.nim                 GeistDefaults
#   [runtime.backup]     src/geist/settings.nim                 GeistDefaults
#
# "" or false in [define] means "not set" (the built-in default).
#
# Two different things are called a PRESET here. Do not mix them up:
#
#   build preset    -d:preset=iot     a file in configs/, how the program
#                                     is COMPILED and what it starts with
#   storage preset  preset = "app"    a shape of database, below in
#                                     [runtime.storage]; docs/workloads.md
#
# The [runtime] tables are read when the program RUNS, from
# configs/default.toml in the working directory, with the build preset's
# file laid over it. A missing file means "built-in defaults": every value
# below is also compiled in, so deleting this file changes nothing. It
# exists to be edited, not to be required.
#
# Anything that varies per DATABASE belongs in the GeistConfig a caller
# passes to openGeist, not here. What is below is the shape of the
# library, not of one store.

[project]
# Only in default.toml: a preset changes how a build is made, not which
# project it is.
name = "geist_database"
version = "2.0.0"
description = "Geist: a packed-row, cluster-addressed encrypted database"
license = "UNLICENSED"
author = "siriuslee69"

[preset]
name = "default"
description = "Desktop and server: ORC, threads, libsodium where it exists."

[nim]
# Every Geist program and test is built this way. A binary built with a
# different memory model is a binary the test suite never covered.
mm = "orc"
threads = true

[define]
hasLibsodium = true      # Tyr may call the system libsodium; configs/android.toml
                         # turns it off, because Android has none to call

[passC]
flags = []

[passL]
flags = []

[runtime.storage]
# Which storage preset openGeist uses when a caller names none.
#
# Nine named after the SHAPE of the data -- pick one of these if you know
# your access pattern:
#   app  collapsed  secure-app  secure-collapsed
#   chat  iot  archive  stream  ledger
#
# Five named after the JOB -- pick one of these if you know what you are
# building. Each carries a ceiling; docs/workloads.md has the numbers.
#   cloud-sync   records several machines reconcile
#   chain        tamper-evident log peers each verify
#   host         content addressed by its own hash (<= ~78 MB an object)
#   live         fast small updates; bounded by the round trip, not by
#                bandwidth, so LAN positions yes and video no
#   bulk         few very large objects; correct on ONE machine, and the
#                streaming path for multi-gigabyte transfer does not
#                exist yet
#
# A name that is not in those lists is an ERROR at load, not at the first
# open, and the message lists the real ones.
preset = "app"

# Bytes. A capped column value at or above this moves out of the row and
# into the sidecar tree, addressed by its own content hash.
sidecarThreshold = 1024

# Give every row the two reserved identity columns, so it can be replaced
# and removed by name and exchanged with a peer. 16 bytes per row.
# Turn off only for append-only streams that are never edited.
rowIdentity = true

# Keep a second, column-first copy of the rows beside the store, so a
# search over one column reads that column instead of every row. The copy
# is DERIVED: the row-major generation stays the truth, and losing it
# costs a rebuild rather than data.
#
#   none      row-major only
#   onSave    rebuilt with every save; never stale, slowest writes
#   interval  rebuilt at most every transposeEverySeconds
#   manual    rebuilt only by `geist transpose`; may be stale, and says so
#
# Not available on a sealed preset: the copy would be plaintext columns
# beside an encrypted file.
transpose = "none"

# Seconds, for transpose = "interval". A daemon that saves often can keep
# the search copy roughly fresh without rewriting it on every write.
transposeEverySeconds = 300

[runtime.backup]
# How many rotation slots to keep beside the live artifacts (.b1 .b2 ...).
copies = 2

# Rotate at least this often, in seconds. 0 leaves the timing to the
# preset's own policy.
everySeconds = 0

