# ---------------------------------------------------------------------------
# iot <- the smallest Geist for a small device that logs readings
# ---------------------------------------------------------------------------
#
#   nim c -d:preset=iot app.nim
#
# Only what differs from default.toml goes here.

[preset]
name = "iot"
description = "Size-optimised; the iot storage preset; no search copy."

[nim]
opt = "size"

[define]
# Compile time: no sidecar code at all. A small device keeps every value in its
# row, and a capped value that does not fit follows its column's overflow policy.
# A build can still read inline values; a row that names a sidecar is refused.
sidecars = false

[default]
# The same choice at run time, for a build that keeps sidecars compiled in.
sidecars = false

[passC]
flags = ["-ffunction-sections", "-fdata-sections"]

[passL]
flags = ["-Wl,--gc-sections"]

[runtime.storage]
preset = "iot"
# A device that only appends readings never replaces a row by name.
rowIdentity = false
transpose = "none"

[runtime.backup]
copies = 1

