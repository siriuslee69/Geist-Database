<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geist · Geräte</title><style>/*MONITOR_CSS*/</style><!--MONITOR_BRIDGE--></head>
<body><header><strong>◈ Geist</strong><span id="device">Geräte</span><span id="connection" title="Vom Server beantwortete Geist-Anfragen">Bereit</span><button id="handshake" title="Beide Verbindungen schließen und neue AM1P+S-Handshakes ausführen">↻ Handshake</button></header>
<main><section id="conversation" aria-label="Nachrichten"><div class="empty">PC ↔ VPS ↔ Phone</div></section><aside id="trace"><h2>Handshake-Echo</h2><div class="suite">AM1P+S · recovery<br>KEM FC · Signatur F0</div><details><summary>Algorithmen</summary><p>ML-KEM-1024 · NTRU-HPS-4096-821 · FireSaber · Saber · FrodoKEM-1344-AES · HQC-5</p><p>SPHINCS+ SHAKE-128f · Dilithium-87 · Falcon-1024 · Ed25519</p><p>XChaCha20 + AES-CTR · BLAKE3 + Gimli · BLAKE3 + SHA3</p></details><ol id="events"></ol></aside></main>
<footer><div class="compose"><select id="channel" title="Nachricht an das andere Gerät weiterleiten oder auf dem VPS speichern"><option value="relay">↔ Anderes Gerät</option><option value="store">▣ VPS speichern</option></select><button id="clear" title="Eingabe leeren">×</button><input id="body" placeholder="Nachricht" maxlength="4000" autocomplete="off" aria-label="Nachricht"><button id="send" title="Über Geist senden">➤</button><button id="showTrace" title="Handshake-Echo anzeigen">⌁</button></div><div id="error" role="status"></div></footer>
<script>/*MONITOR_JS*/</script></body></html>
