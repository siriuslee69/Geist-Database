name: Geist CI

# Every step below names a task that EXISTS in geist_database.nimble.
# An earlier version of this file called `doctor`, `testProtocols`,
# `testSoak`, `testInterfaces` and `benchCore`, none of which were ever
# written -- so the workflow failed on its first step and the rest of it
# was never reached. If you add a step here, run the task locally first.

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows 11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # one level: the pins below are all Geist needs
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
      - name: Compile-check every public module
        run: nimble checkAll
      - name: Prove the storage half needs no network stack
        run: nimble checkModular
      - name: Prove the wire half needs no database
        run: nimble checkRelay
      - name: Prove the router needs no store
        run: nimble checkRouter
      - name: Full test suite
        run: nimble test

  nix:
    name: Nix package and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # one level: the pins below are all Geist needs
      - uses: cachix/install-nix-action@v27
      - name: Build Nix package
        run: nix-build nix/default.nix
      - name: Repo gates in Nix shell
        run: |
          nix-shell -p nim libsodium --run "nimble checkAll"
          nix-shell -p nim libsodium --run "nimble checkModular"
          nix-shell -p nim libsodium --run "nimble checkRelay"
          nix-shell -p nim libsodium --run "nimble checkRouter"
          nix-shell -p nim libsodium --run "nimble test"
          nix-shell -p nim libsodium --run "nimble runExamples"
          nix-shell -p nim libsodium --run "nimble buildAll"
